name: Publish npm packages

on:
  workflow_dispatch:  # allow manual publish (e.g. from dev on this fork)
  push:
    branches:
      - dev

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false  # Don't cancel publishing in progress

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          token: ${{ secrets.NPM_PUBLISH_VERSION_UPDATE_PR_PAT || github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 'latest'
          # Registry + auth come from the committed root .npmrc (@hexclave scope ->
          # npm.egelhaus.de) plus the NODE_AUTH_TOKEN env on the publish step.

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build:packages

      - name: Publish packages
        # pnpm publish skips versions that already exist on the registry by default
        run: pnpm publish -r --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Update package versions on dev
        # Upstream release automation (needs a PAT + push rights). On forks without
        # the PAT this may fail; publishing already happened, so don't fail the run.
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add .
          git diff --exit-code HEAD

          git fetch origin dev
          git diff --exit-code HEAD origin/dev

          pnpm install --frozen-lockfile

          CHANGESET_FILE=".changeset/update-package-versions-${GITHUB_RUN_ID}.md"
          cat > "$CHANGESET_FILE" <<'EOF'
          ---
          "@hexclave/next": patch
          ---

          Update package versions.
          EOF

          pnpm changeset version

          version=$(grep '"version":' packages/template/package.json)
          sed "s/^[[:space:]]*\"version\":.*/$version/" packages/template/package-template.json > packages/template/package-template.json.untracked.tmp
          mv packages/template/package-template.json.untracked.tmp packages/template/package-template.json

          # The AI setup prompt pins the SDK version it tells users to import from esm.sh, so bumping
          # package versions changes the docs generated from it. Regenerate them here, or the committed
          # files go stale and lint-and-build's "check for uncommitted changes" step fails on dev and on
          # every PR opened against it. Runs the sources directly via tsx, so no build step is needed.
          pnpm run generate-setup-prompt-docs

          git add -A
          if git diff --staged --quiet; then
            echo "No package version changes to commit"
            exit 0
          fi

          git commit -m "chore: update package versions"
          git push origin dev
